name: WHOOP Daily Report

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install requests

      - name: Run WHOOP Report
        env:
          WHOOP_ACCESS_TOKEN: ${{ secrets.WHOOP_ACCESS_TOKEN }}

        run: |
          python whoop_report.py

      - name: Save Report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add WHOOP_Report.md whoop_history.json
          git commit -m "Update WHOOP trend report" || true
          git push
