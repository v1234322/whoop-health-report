name: WHOOP Daily Report

on:
  schedule:
    # 工作日 08:30（新加坡/北京时间）
    # GitHub Actions 使用 UTC，因此 08:30 UTC+8 = 00:30 UTC
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
  
jobs:
  report:
    runs-on: ubuntu-latest
      
    steps:
       - name: Checkout
         uses: actions/checkout@v4
       - name: Test workflow
         run: |
           echo "WHOOP Daily Report"
           date
