name: WHOOP Health Report
on:
   schedule:
     - cron: '30 0 * * 1-5'
     - cron: '30 2 * * 6,0'
   workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install packages
        run: |
          pip install requests
          
      - name: Run report
        run: python report.py
